# Region: Central Mato Grosso soybean belt, Brazil
# Read by examples/run_region_delineation.sh (via 'agribound tiles region') and
# agribound.hpc.regions.load_region. 'run' holds the defaults the driver uses;
# everything else documents how the region was checked. bbox values are EPSG:4326
# [minx, miny, maxx, maxy]. Paths in 'run' are relative to this file.
name: mato_grosso_br
title: Central Mato Grosso soybean belt, Brazil
description: 'A 4.5 x 4 degree box over the central Mato Grosso soybean belt (BR-163 corridor: Sorriso,
  Lucas do Rio Verde, Nova Mutum). Not the whole state, whose FAO GAUL 2015 bounds are -61.633, -18.042,
  -50.224, -7.349.'
country: BR
bbox: [-58.5, -15.0, -54.0, -11.0]
bbox_source: hand-drawn box over the central soybean belt
test_bbox: [-55.8, -12.6, -55.65, -12.45]
test_bbox_source: hand-picked box around Sorriso, checked with WorldCover (2026-09-26)
study_area: null
area_km2: 216083
utm_zones: [21]
run:
  years: [2023, 2024]
  sources: [sentinel2, landsat, google-embedding, tessera-embedding]
  engines: [delineate-anything, ftw, embedding]
  tile_size_km: 20
  halo_m: 3000
  reference: null
  tessera_version: v1.1
tiling:
  n_tiles: 575
  grid: utm
  computed_with: agribound.hpc.tiles.make_tiles(bbox, tile_size_m=20000, halo_m=3000, crs='utm', clip=True)
  halo_note: halo_m is an agribound choice; it must exceed the largest field dimension expected here (fields
    larger than the halo that cross a tile core boundary can be truncated). Check n_reaching_halo_edge
    in the merge summary.
verification:
  worldcover_date: '2026-09-26'
  method: 'ESA/WorldCover/v200 (2021) Map == 40 (cropland): share of seeded random points (ee.FeatureCollection.randomPoints,
    seed 0) sampled at 10 m inside the bbox, the same share among land points (Map != 80), and the mean
    of the class-40 mask at 1 km (GEE pyramid, approximate).'
  worldcover_v200_cropland_fraction: 0.288
  worldcover_v200_cropland_fraction_of_land: 0.289
  worldcover_v200_cropland_fraction_1km: 0.299
  worldcover_points: 1441 cropland of 5000 valid points
  test_bbox_worldcover_v200_cropland_fraction: 0.459
sources:
  checked: GEE image counts 2026-09-26 (with the author's Earth Engine project); TESSERA manifests fetched 2026-09-26;
    USGS NAIP Plus catalogue queried 2026-09-27
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    images_intersecting_bbox:
      2017: 516
      2019: 3387
      2023: 3446
      2024: 3452
      2025: 4719
  landsat:
    collection: LANDSAT/LC08|LC09/C02/T1_L2 (L8 + L9 counted)
    images_intersecting_bbox:
      2023: 800
      2024: 745
  hls:
    collection: NASA/HLS/HLSL30/v002 + HLSS30/v002
    l30_images:
      2023: 2163
      2024: 1951
    s30_images:
      2023: 4386
      2024: 4598
  naip: not available (US only)
  usgs-naip-plus: not available (US only)
  spot:
    access: restricted (AIRBUS/SPOT6_7; DRI-internal GEE access)
    scenes_intersecting_bbox_by_year:
      2013: 35
      2014: 180
      2015: 89
      2016: 95
      2017: 101
      2018: 192
      2019: 170
      2020: 98
      2021: 74
      2022: 30
      2023: 25
    note: 'Scene counts, not coverage: scenes may cover only part of the bbox.'
  google-embedding:
    collection: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL
    images_by_year:
      2017: 20
      2018: 20
      2019: 20
      2020: 20
      2021: 20
      2022: 20
      2023: 20
      2024: 20
      2025: 20
  tessera-embedding:
    v1:
      tiles_expected: 1800
      tiles_by_year:
        2017: 100
        2018: 102
        2019: 977
        2020: 104
        2021: 101
        2022: 105
        2023: 104
        2024: 1800
        2025: 1128
    v1.1:
      tiles_expected: 1800
      tiles_by_year:
        2017: 1800
        2018: 1800
        2019: 1800
        2020: 1800
        2021: 1800
        2022: 1800
        2023: 1800
        2024: 1800
        2025: 1800
    note: 'Tile counts from the TESSERA manifests (v1 ''vultr'', v1.1 ''cambridge'') fetched 2026-09-26:
      0.1-degree tiles present per year vs. all tiles intersecting the bbox (expected includes water,
      which has no tiles). Coverage changes; re-check with agribound.composites.local.tessera_coverage
      before large runs.'
reference_data:
- 'FTW benchmark chips for Brazil (ftw-tools: ''ftw data download''); these are sample chips, not wall-to-wall
  boundaries.'
ftw:
  in_ftw_benchmark_countries: true
  note: Brazil is one of the FTW benchmark countries (ftw_tools.settings.ALL_COUNTRIES); the default FTW
    model (FTW_PRUE_EFNET_B5) was trained on the full FTW data.
  published_predictions: FTW Global prediction polygons exist for country BR (Source Cooperative alpha/results-by-admin-conf);
    query them with 'agribound query-ftw --study-area bbox:... --year 2024'. They are model outputs, not
    reference data.
notes:
- Fields of several kilometres occur; halo_m 3000 is an agribound choice. Check n_reaching_halo_edge in
  the merge summary and raise the halo if it is not ~0.
- WorldCover class 40 covers about 29 % of the box.
