# Region: New Mexico statewide, USA
# Read by examples/run_region_delineation.sh (via 'agribound tiles region') and
# agribound.hpc.regions.load_region. 'run' holds the defaults the driver uses;
# everything else documents how the region was checked. bbox values are EPSG:4326
# [minx, miny, maxx, maxy]. Paths in 'run' are relative to this file.
name: new_mexico_statewide_us
title: New Mexico statewide, USA
description: 'The whole state of New Mexico: irrigated agriculture along the Rio Grande, the Pecos and
  San Juan valleys and on the eastern plains, within a mostly non-agricultural state.'
country: US
bbox: [-109.0505, 31.3322, -102.9976, 37.0003]
bbox_source: union of the TIGER/2018/States bounds of New Mexico and the extent of the NMOSE WUCB polygons
  (which reach 0.0044 degrees east of the state box), rounded outwards to 1e-4 degrees
test_bbox: [-106.8, 34.6, -106.75, 34.65]
test_bbox_source: hand-picked box on the Rio Grande valley near Belen, checked with WorldCover
study_area: null
area_km2: 350775
utm_zones: [12, 13]
run:
  years: [2022, 2024]
  sources: [sentinel2, landsat, naip, tessera-embedding]
  engines: [delineate-anything, ftw, embedding]
  tile_size_km: 20
  halo_m: 1500
  reference: ../NMOSE Field Boundaries/WUCB ag polys.shp
tiling:
  n_tiles: 950
  grid: utm
  computed_with: agribound.hpc.tiles.make_tiles(bbox, tile_size_m=20000, halo_m=1500, crs='utm', clip=True)
  halo_note: 'halo_m is an agribound choice; fields longer than the halo that cross a tile core boundary
    can be truncated. 1500 m covers 97.8 % of the NMOSE reference fields but not all of them (bounding-box
    long side in the UTM zone of each of the 50,660 single-part polygons, checked 2026-09-28: median 240 m,
    p99 1618 m, max 4891 m; 1136 exceed 1500 m, 154 exceed 2000 m, 53 exceed 2500 m). Raise halo_m (for
    example to 2500 m, or 5000 m to cover every reference field) when large fields matter, and check
    n_reaching_halo_edge in the merge summary.'
verification:
  worldcover_date: '2026-09-27'
  method: 'ESA/WorldCover/v200 (2021) Map == 40 (cropland): share of seeded random points (ee.FeatureCollection.randomPoints,
    seed 0) sampled at 10 m inside the bbox, the same share among land points (Map != 80), and the mean
    of the class-40 mask at 1 km (GEE pyramid, approximate).'
  worldcover_v200_cropland_fraction: 0.016
  worldcover_v200_cropland_fraction_of_land: 0.016
  worldcover_v200_cropland_fraction_1km: 0.014
  worldcover_points: 79 cropland of 5000 valid points
  test_bbox_worldcover_v200_cropland_fraction: 0.237
  cdl_2023_cultivated_fraction: 0.025
  test_bbox_cdl_2023_cultivated_fraction: 0.267
  cdl_method: 'USDA/NASS/CDL 2023 ''cultivated'' band == 2: share of 5,000 (test box 2,000) seeded random
    points sampled at 30 m.'
