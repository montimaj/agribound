reference_data:
- 'examples/NMOSE Field Boundaries/WUCB ag polys.shp: New Mexico Office of the State Engineer water-use
  agricultural polygons, 50,603 polygons (EPSG:26913; local, not distributed).'
ftw:
  in_ftw_benchmark_countries: false
  note: Not an FTW benchmark country (ftw_tools.settings.ALL_COUNTRIES), so FTW models run out of their
    training distribution here; compare with Delineate-Anything and check a reference sample.
  published_predictions: FTW Global prediction polygons exist for country US (Source Cooperative alpha/results-by-admin-conf);
    query them with 'agribound query-ftw --study-area bbox:... --year 2024'. They are model outputs, not
    reference data.
notes:
- Only about 1.6 % of the bbox is cropland (WorldCover), so most tiles hold few fields but are still downloaded
  and processed. A study area built from the NMOSE polygons (e.g. their buffered convex hulls) cuts the
  number of tiles; do not use the polygons themselves as the study area when they are also the reference.
- NAIP in GEE ends in 2023 (registry range 2002-2023), so the 2024 NAIP run is skipped by the driver.
- 'The bbox is the state''s bounding box and extends beyond New Mexico: about 7.4 % of it is Texas
  (mostly around El Paso and the Trans-Pecos; TIGER/2018/States) and 2.7 % is Mexico (northern Chihuahua
  and Sonora, including the Valle de Juarez; LSIB_SIMPLE/2017). About 1,060 of the 5,050 km2 of WorldCover
  2021 cropland in the bbox (300 m, approximate; checked 2026-09-28) lies outside New Mexico, and the
  worldcover_v200_cropland_fraction values above cover the whole bbox. The NMOSE reference covers New
  Mexico only, so detections outside the state count as false positives in an evaluation: clip the
  predictions (or the evaluation) to the state, or set study_area to a file with the state polygon.'
