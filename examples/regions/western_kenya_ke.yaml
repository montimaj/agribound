# Region: Western Kenya
# Read by examples/run_region_delineation.sh (via 'agribound tiles region') and
# agribound.hpc.regions.load_region. 'run' holds the defaults the driver uses;
# everything else documents how the region was checked. bbox values are EPSG:4326
# [minx, miny, maxx, maxy]. Paths in 'run' are relative to this file.
name: western_kenya_ke
title: Western Kenya
description: 'Western Kenya (parts of Busia, Bungoma, Kakamega, Vihiga, Trans-Nzoia, Uasin Gishu and Kisumu
  counties): smallholder farming.'
country: KE
bbox: [34.0, -0.3, 35.6, 1.3]
bbox_source: hand-drawn box over western Kenya
test_bbox: [34.7, 0.4, 34.8, 0.5]
test_bbox_source: 0.1-degree cell picked by a WorldCover class-40 search inside the bbox (2026-09-26)
study_area: null
area_km2: 31511
utm_zones: [36]
run:
  years: [2023, 2024]
  sources: [sentinel2, google-embedding, tessera-embedding]
  engines: [delineate-anything, ftw, embedding]
  tile_size_km: 20
  halo_m: 1000
  reference: null
tiling:
  n_tiles: 90
  grid: utm
  computed_with: agribound.hpc.tiles.make_tiles(bbox, tile_size_m=20000, halo_m=1000, crs='utm', clip=True)
  halo_note: halo_m is an agribound choice; it must exceed the largest field dimension expected here (fields
    larger than the halo that cross a tile core boundary can be truncated). Check n_reaching_halo_edge
    in the merge summary.
verification:
  worldcover_date: '2026-09-26'
  method: 'ESA/WorldCover/v200 (2021) Map == 40 (cropland): share of seeded random points (ee.FeatureCollection.randomPoints,
    seed 0) sampled at 10 m inside the bbox, the same share among land points (Map != 80), and the mean
    of the class-40 mask at 1 km (GEE pyramid, approximate).'
  worldcover_v200_cropland_fraction: 0.244
  worldcover_v200_cropland_fraction_of_land: 0.256
  worldcover_v200_cropland_fraction_1km: 0.279
  worldcover_points: 1222 cropland of 5000 valid points
  test_bbox_worldcover_v200_cropland_fraction: 0.694
sources:
  checked: GEE image counts 2026-09-26 (with the author's Earth Engine project); TESSERA manifests fetched 2026-09-26;
    USGS NAIP Plus catalogue queried 2026-09-27
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    images_intersecting_bbox:
      2017: 135
      2019: 583
      2023: 570
      2024: 594
      2025: 813
  landsat:
    collection: LANDSAT/LC08|LC09/C02/T1_L2 (L8 + L9 counted)
    images_intersecting_bbox:
      2023: 180
      2024: 168
  hls:
    collection: NASA/HLS/HLSL30/v002 + HLSS30/v002
    l30_images:
      2023: 403
      2024: 394
    s30_images:
      2023: 2054
      2024: 2203
  naip: not available (US only)
  usgs-naip-plus: not available (US only)
  spot:
    access: restricted (AIRBUS/SPOT6_7; DRI-internal GEE access)
    scenes_intersecting_bbox_by_year:
      2013: 43
      2014: 34
      2015: 43
      2016: 48
      2017: 40
      2018: 46
      2019: 13
      2020: 16
      2021: 11
      2022: 1
      2023: 10
    note: 'Scene counts, not coverage: scenes may cover only part of the bbox.'
  google-embedding:
    collection: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL
    images_by_year:
      2017: 8
      2018: 8
      2019: 8
      2020: 8
      2021: 8
      2022: 8
      2023: 8
      2024: 8
      2025: 8
  tessera-embedding:
    v1:
      tiles_expected: 256
      tiles_by_year:
        2017: 256
        2018: 256
        2019: 256
        2020: 256
        2021: 256
        2022: 256
        2023: 256
        2024: 256
        2025: 256
    v1.1:
      tiles_expected: 256
      tiles_by_year:
        2015: 1
        2017: 47
        2018: 47
        2019: 47
        2020: 47
        2021: 47
        2022: 47
        2023: 47
        2024: 47
        2025: 47
    note: 'Tile counts from the TESSERA manifests (v1 ''vultr'', v1.1 ''cambridge'') fetched 2026-09-26:
      0.1-degree tiles present per year vs. all tiles intersecting the bbox (expected includes water,
      which has no tiles). Coverage changes; re-check with agribound.composites.local.tessera_coverage
      before large runs.'
reference_data:
- 'FTW benchmark chips for Kenya (ftw-tools: ''ftw data download''); these are sample chips, not wall-to-wall
  boundaries.'
ftw:
  in_ftw_benchmark_countries: true
  note: Kenya is one of the FTW benchmark countries (ftw_tools.settings.ALL_COUNTRIES); the default FTW
    model (FTW_PRUE_EFNET_B5) was trained on the full FTW data.
  published_predictions: FTW Global prediction polygons exist for country KE (Source Cooperative alpha/results-by-admin-conf);
    query them with 'agribound query-ftw --study-area bbox:... --year 2024'. They are model outputs, not
    reference data.
notes:
- Smallholder fields are often only a few Sentinel-2 pixels wide; expect low recall for the smallest fields
  at 10 m.
- The bbox crosses the equator, so tiles use both UTM 36N/36S grids.
- 'The bbox extends into Uganda: 14.6 % of it is Uganda (LSIB_SIMPLE/2017), holding about 15 % of the
  WorldCover 2021 cropland in the bbox (300 m, approximate; checked 2026-09-28). The
  worldcover_v200_cropland_fraction values above cover the whole bbox; clip results to Kenya for
  country statistics.'
