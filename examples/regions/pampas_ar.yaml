# Region: Pampas, Argentina
# Read by examples/run_region_delineation.sh (via 'agribound tiles region') and
# agribound.hpc.regions.load_region. 'run' holds the defaults the driver uses;
# everything else documents how the region was checked. bbox values are EPSG:4326
# [minx, miny, maxx, maxy]. Paths in 'run' are relative to this file.
name: pampas_ar
title: Pampas, Argentina
description: 'The humid Pampas of northern Buenos Aires, southern Santa Fe and south-eastern Cordoba:
  large soybean, maize and wheat fields.'
country: AR
bbox: [-63.5, -36.5, -58.5, -32.0]
bbox_source: hand-drawn box over the humid Pampas
test_bbox: [-60.8, -34.0, -60.3, -33.5]
test_bbox_source: study area of examples/05_pampas_embeddings.py (near Pergamino)
study_area: null
area_km2: 229850
utm_zones: [20, 21]
run:
  years: [2024]
  sources: [sentinel2, landsat, google-embedding, tessera-embedding]
  engines: [delineate-anything, ftw, embedding]
  tile_size_km: 20
  halo_m: 2000
  reference: null
tiling:
  n_tiles: 642
  grid: utm
  computed_with: agribound.hpc.tiles.make_tiles(bbox, tile_size_m=20000, halo_m=2000, crs='utm', clip=True)
  halo_note: halo_m is an agribound choice; it must exceed the largest field dimension expected here (fields
    larger than the halo that cross a tile core boundary can be truncated). Check n_reaching_halo_edge
    in the merge summary.
verification:
  worldcover_date: '2026-09-26'
  method: 'ESA/WorldCover/v200 (2021) Map == 40 (cropland): share of seeded random points (ee.FeatureCollection.randomPoints,
    seed 0) sampled at 10 m inside the bbox, the same share among land points (Map != 80), and the mean
    of the class-40 mask at 1 km (GEE pyramid, approximate).'
  worldcover_v200_cropland_fraction: 0.652
  worldcover_v200_cropland_fraction_of_land: 0.663
  worldcover_v200_cropland_fraction_1km: 0.681
  worldcover_points: 3261 cropland of 5000 valid points
  test_bbox_worldcover_v200_cropland_fraction: 0.919
sources:
  checked: GEE image counts 2026-09-26 (with the author's Earth Engine project); TESSERA manifests fetched 2026-09-26;
    USGS NAIP Plus catalogue queried 2026-09-27
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    images_intersecting_bbox:
      2017: 783
      2019: 4841
      2023: 4909
      2024: 4907
      2025: 5771
  landsat:
    collection: LANDSAT/LC08|LC09/C02/T1_L2 (L8 + L9 counted)
    images_intersecting_bbox:
      2023: 820
      2024: 860
  hls:
    collection: NASA/HLS/HLSL30/v002 + HLSS30/v002
    l30_images:
      2023: 2721
      2024: 2773
    s30_images:
      2023: 5348
      2024: 5451
  naip: not available (US only)
  usgs-naip-plus: not available (US only)
  spot:
    access: restricted (AIRBUS/SPOT6_7; DRI-internal GEE access)
    scenes_intersecting_bbox_by_year:
      2012: 2
      2013: 79
      2014: 160
      2015: 291
      2016: 203
      2017: 356
      2018: 232
      2019: 127
      2020: 65
      2021: 64
      2022: 89
      2023: 106
    note: 'Scene counts, not coverage: scenes may cover only part of the bbox.'
  google-embedding:
    collection: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL
    images_by_year:
      2017: 20
      2018: 20
      2019: 20
      2020: 20
      2021: 20
      2022: 20
      2023: 20
      2024: 20
      2025: 20
  tessera-embedding:
    v1:
      tiles_expected: 2250
      tiles_by_year:
        2017: 186
        2018: 191
        2019: 173
        2020: 189
        2021: 189
        2022: 188
        2023: 176
        2024: 2250
    v1.1:
      tiles_expected: 2250
      tiles_by_year:
        2017: 7
        2018: 7
        2019: 7
        2020: 7
        2021: 7
        2022: 7
        2023: 7
        2024: 7
        2025: 7
    note: 'Tile counts from the TESSERA manifests (v1 ''vultr'', v1.1 ''cambridge'') fetched 2026-09-26:
      0.1-degree tiles present per year vs. all tiles intersecting the bbox (expected includes water,
      which has no tiles). Coverage changes; re-check with agribound.composites.local.tessera_coverage
      before large runs.'
reference_data:
- No field-boundary reference data is bundled with agribound for this region.
ftw:
  in_ftw_benchmark_countries: false
  note: Not an FTW benchmark country (ftw_tools.settings.ALL_COUNTRIES), so FTW models run out of their
    training distribution here; compare with Delineate-Anything and check a reference sample.
  published_predictions: FTW Global prediction polygons exist for country AR (Source Cooperative alpha/results-by-admin-conf);
    query them with 'agribound query-ftw --study-area bbox:... --year 2024'. They are model outputs, not
    reference data.
notes:
- TESSERA v1 is complete here only for 2024 (about 8 % of tiles in 2017-2023) and v1.1 has 7 tiles, so
  the default year is 2024; other years need --sources without tessera-embedding.
