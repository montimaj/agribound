  google-embedding:
    collection: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL
    images_by_year:
      2017: 20
      2018: 20
      2019: 20
      2020: 20
      2021: 20
      2022: 20
      2023: 20
      2024: 20
      2025: 20
