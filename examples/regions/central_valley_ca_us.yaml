# Region: Central Valley, California, USA
# Read by examples/run_region_delineation.sh (via 'agribound tiles region') and
# agribound.hpc.regions.load_region. 'run' holds the defaults the driver uses;
# everything else documents how the region was checked. bbox values are EPSG:4326
# [minx, miny, maxx, maxy]. Paths in 'run' are relative to this file.
name: central_valley_ca_us
title: Central Valley, California, USA
description: Sacramento and San Joaquin valleys. The bbox also covers the Coast Ranges and Sierra Nevada
  foothills, which lowers the cropland fraction.
country: US
bbox: [-122.6, 35.0, -118.6, 40.7]
bbox_source: hand-drawn box around the Sacramento and San Joaquin valleys
test_bbox: [-120.1, 36.3, -120.0, 36.4]
test_bbox_source: 0.1-degree cell picked by a CDL cultivated / WorldCover class-40 search (2026-09-26)
study_area: null
area_km2: 222621
utm_zones: [10, 11]
run:
  years: [2022, 2024]
  sources: [sentinel2, landsat, naip, tessera-embedding]
  engines: [delineate-anything, ftw, embedding]
  tile_size_km: 20
  halo_m: 1500
  reference: null
tiling:
  n_tiles: 609
  grid: utm
  computed_with: agribound.hpc.tiles.make_tiles(bbox, tile_size_m=20000, halo_m=1500, crs='utm', clip=True)
  halo_note: halo_m is an agribound choice; it must exceed the largest field dimension expected here (fields
    larger than the halo that cross a tile core boundary can be truncated). Check n_reaching_halo_edge
    in the merge summary.
verification:
  worldcover_date: '2026-09-26'
  method: 'ESA/WorldCover/v200 (2021) Map == 40 (cropland): share of seeded random points (ee.FeatureCollection.randomPoints,
    seed 0) sampled at 10 m inside the bbox, the same share among land points (Map != 80), and the mean
    of the class-40 mask at 1 km (GEE pyramid, approximate).'
  worldcover_v200_cropland_fraction: 0.09
  worldcover_v200_cropland_fraction_of_land: 0.097
  worldcover_v200_cropland_fraction_1km: 0.092
  worldcover_points: 421 cropland of 4673 valid points
  test_bbox_worldcover_v200_cropland_fraction: 0.797
  cdl_2023_cultivated_fraction: 0.183
  test_bbox_cdl_2023_cultivated_fraction: 0.954
  cdl_method: 'USDA/NASS/CDL 2023 ''cultivated'' band == 2: share of 5,000 (test box 2,000) seeded random
    points sampled at 30 m.'
sources:
  checked: GEE image counts 2026-09-26 (with the author's Earth Engine project); TESSERA manifests fetched 2026-09-26;
    USGS NAIP Plus catalogue queried 2026-09-27
  sentinel2:
    collection: COPERNICUS/S2_SR_HARMONIZED
    images_intersecting_bbox:
