      0.1-degree tiles present per year vs. all tiles intersecting the bbox (expected includes water,
      which has no tiles). Coverage changes; re-check with agribound.composites.local.tessera_coverage
      before large runs.'
reference_data:
- No field-boundary reference data is bundled with agribound for this region.
ftw:
  in_ftw_benchmark_countries: false
  note: Not an FTW benchmark country (ftw_tools.settings.ALL_COUNTRIES), so FTW models run out of their
    training distribution here; compare with Delineate-Anything and check a reference sample.
  published_predictions: FTW Global prediction polygons exist for country US (Source Cooperative alpha/results-by-admin-conf);
    query them with 'agribound query-ftw --study-area bbox:... --year 2024'. They are model outputs, not
    reference data.
example_aois:
- script: examples/07_usa_naip_high_res.py
  bbox: [-119.85, 36.7, -119.75, 36.78]
  worldcover_v200_cropland_fraction: 0.068
- script: examples/16_usa_usgs_naip_plus.py
  bbox: [-119.85, 36.7, -119.75, 36.78]
  worldcover_v200_cropland_fraction: 0.068
notes:
- WorldCover class 40 counts annual cropland only; perennial tree crops (orchards, vineyards), which are
  common here, map to tree or shrub cover, so the CDL cultivated fraction is the better agricultural check
  for this region.
- For production, a Central Valley outline as study area avoids tiling the ranges.
