site_name: Agribound
site_description: Agricultural field boundary delineation from satellite imagery with published segmentation models, geospatial foundation models and embeddings.
site_url: https://montimaj.github.io/agribound
repo_url: https://github.com/montimaj/agribound
repo_name: montimaj/agribound

validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_readtime: true
      archive: true
      categories: true
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Migrating to 1.0: migration-1.0.md
  - User Guide:
      - Quickstart: user-guide/quickstart.md
      - Satellite Sources: user-guide/satellite-sources.md
      - Delineation Engines: user-guide/engines.md
      - SAM Refinement: user-guide/sam-refinement.md
      - Configuration Reference: user-guide/configuration.md
      - CLI Usage: user-guide/cli.md
      - Fine-Tuning: user-guide/fine-tuning.md
      - Evaluation: user-guide/evaluation.md
      - Reproducibility: user-guide/reproducibility.md
      - HPC and Large Areas: user-guide/hpc.md
      - Agent Layer: user-guide/agent.md
      - FTW Polygon Query: user-guide/ftw-query.md
      - GEE Setup: user-guide/gee-setup.md
  - API Reference:
      - Pipeline: api/pipeline.md
      - Configuration: api/config.md
      - Registry: api/registry.md
      - Composites: api/composites.md
      - Engines: api/engines.md
      - Post-Processing: api/postprocess.md
      - I/O Utilities: api/io.md
      - Evaluation: api/evaluate.md
      - Provenance and Reproducibility: api/provenance.md
      - Published FTW Polygons: api/ftw-query.md
      - HPC Tiling: api/hpc.md
      - Agent: api/agent.md
      - Visualization: api/visualize.md
  - Gallery:
      - agribound 1.0: gallery.md
      - agribound 0.1.x (archived): gallery-0.1x.md
  - Blog: blog/index.md
  - Contributing: contributing.md
  - Citation & References: citation.md
