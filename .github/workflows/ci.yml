name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline-safe test selection shared by every test job.
  PYTEST_MARKERS: "not gpu and not gee and not slow and not network"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff and nbformat
        run: python -m pip install "ruff>=0.3" "nbformat>=5.9"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Check example notebooks match their scripts
        # Runs even when a ruff step failed, so both results are reported.
        if: ${{ !cancelled() }}
        run: python tools/sync_notebooks.py --check

  test-core:
    name: Core Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run unit and CLI tests
        run: python -m pytest tests/unit tests/integration/test_cli.py -m "${{ env.PYTEST_MARKERS }}" --tb=short -q

  test-engines:
    name: Engine & Integration Tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        # CPU wheels avoid downloading several GB of CUDA libraries. torchvision
        # is capped to match ftw-tools 2.x (torchvision<0.26).
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch" "torchvision<0.26" --index-url https://download.pytorch.org/whl/cpu
      - name: Install engine dependencies
        # `gee` brings earthengine-api, geedim and google-auth, so the Earth Engine
        # and authentication unit tests (all mocked, no credentials) run here too.
        run: python -m pip install ".[gee,delineate-anything,ftw,geoai,tessera,agent,dev]"
      - name: Show resolved versions
        run: python -m pip list
      - name: Run unit and integration tests
        run: python -m pytest tests -m "${{ env.PYTEST_MARKERS }}" --tb=short -q

  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/site" --exclude-path site/404.html site/
          lycheeVersion: v0.18.1
          fail: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4
